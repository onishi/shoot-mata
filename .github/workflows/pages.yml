name: Verify and deploy PALIMPSEST WAKE v4.1

on:
  push:
    branches: [main]
    paths:
      - "ver04.1/game/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "ver04.1/game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: ver04.1/game/package-lock.json

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.1

      - name: Install the locked dependency tree
        working-directory: ver04.1/game
        run: npm ci

      - name: Install the pinned Chrome runtime
        working-directory: ver04.1/game
        run: npx playwright install --with-deps chromium

      - name: Verify the v4.1 release candidate
        working-directory: ver04.1/game
        run: npm run verify

      - name: Build the preserved v3 routes
        working-directory: ver03.4/game
        run: npm run build

      - name: Rebuild and inspect the preserved v4.0 route
        working-directory: ver04/game
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: npm ci && npm run build && npm run package:release && npm run verify:release

      - name: Assemble and inspect the Pages artifact
        working-directory: ver04.1/game
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: npm run package:release && npm run verify:release

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - name: Upload verified v4.1 with preserved v4.0 and v3 routes
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ver04.1/game/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the live release and preserved routes
        run: node ver04.1/game/scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
