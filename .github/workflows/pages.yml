name: Verify and deploy shoot-mata v3.4

on:
  push:
    branches: [main]
    paths:
      - "ver03/game/**"
      - "ver03.1/game/**"
      - "ver03.2/game/**"
      - "ver03.3/game/**"
      - "ver03.4/game/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "ver03/game/**"
      - "ver03.1/game/**"
      - "ver03.2/game/**"
      - "ver03.3/game/**"
      - "ver03.4/game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: ver03.4/game/package-lock.json

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.1

      - name: Install the locked dependency tree
        working-directory: ver03.4/game
        run: npm ci

      - name: Build, test, and run the Chrome playthrough
        working-directory: ver03.4/game
        run: npm run verify

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - name: Upload verified v3.4 with preserved v3.3, v3.2, v3.1, and v3
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ver03.4/game/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
