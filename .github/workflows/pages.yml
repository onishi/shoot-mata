name: Deploy shoot-mata production

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release artifact to deploy
        required: true
        type: choice
        options:
          - v02-phase10-rc1
          - rollback-v01
      confirmation:
        description: Type the selected release name to confirm the production replacement
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Require an explicit production confirmation
        env:
          SELECTED_RELEASE: ${{ inputs.release }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$SELECTED_RELEASE" = "$CONFIRMATION"

      - name: Check out the accepted v02 source
        if: inputs.release == 'v02-phase10-rc1'
        uses: actions/checkout@v7

      - name: Check out the last known-good v01 source
        if: inputs.release == 'rollback-v01'
        uses: actions/checkout@v7
        with:
          ref: 9abf0248aa5b8e97749a2e2c380d9ad3e3b69b28

      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: Install the pinned npm version for v02
        if: inputs.release == 'v02-phase10-rc1'
        run: npm install --global npm@11.19.1

      - name: Verify and reproduce the accepted v02 release candidate
        if: inputs.release == 'v02-phase10-rc1'
        working-directory: ver02/game
        run: |
          npm ci
          npm run verify

      - name: Rebuild the last known-good v01 release
        if: inputs.release == 'rollback-v01'
        working-directory: phase-11-01
        run: |
          npm ci
          npm test
          npm run playtest
          npm run build

      - uses: actions/configure-pages@v6

      - name: Upload the accepted v02 artifact
        if: inputs.release == 'v02-phase10-rc1'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ver02/game/dist

      - name: Upload the last known-good v01 artifact
        if: inputs.release == 'rollback-v01'
        uses: actions/upload-pages-artifact@v5
        with:
          path: phase-11-01/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
