name: Verify and deploy RINGWARD v13.2

on:
  push:
    branches: [main]
    paths:
      - "ver13/game/**"
      - "ver13.1/game/**"
      - "ver13.2/game/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "ver13/game/**"
      - "ver13.1/game/**"
      - "ver13.2/game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            ver13.2/game/package-lock.json
            ver12.2/game/package-lock.json
            ver05.1/game/package-lock.json
            ver04.2/game/package-lock.json

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.1

      - name: Install the v12.2 locked dependency tree
        working-directory: ver12.2/game
        run: npm ci

      - name: Install the v13.2 locked dependency tree
        working-directory: ver13.2/game
        run: npm ci

      - name: Verify the v13.2 release candidate
        working-directory: ver13.2/game
        run: npm run verify

      - name: Install the preserved v5.1 dependency tree
        working-directory: ver05.1/game
        run: npm ci

      - name: Install the pinned Chrome runtime
        working-directory: ver12.2/game
        run: npx playwright install --with-deps chromium

      - name: Verify the v12.2 release candidate
        working-directory: ver12.2/game
        run: npm run verify

      - name: Verify the preserved v5.1 release candidate
        working-directory: ver05.1/game
        run: npm run verify

      - name: Build the preserved v3 routes
        working-directory: ver03.4/game
        run: npm ci && npm run build

      - name: Rebuild and inspect the preserved v4.0 route
        working-directory: ver04/game
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: npm ci && npm run build && npm run package:release && npm run verify:release

      - name: Rebuild and inspect the preserved v4.1 route
        working-directory: ver04.1/game
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: npm ci && npm run build && npm run package:release && npm run verify:release

      - name: Rebuild and inspect the preserved v4.2 route
        working-directory: ver04.2/game
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: npm ci && npm run build && npm run package:release && npm run verify:release

      - name: Assemble and inspect the v5.1 Pages artifact
        working-directory: ver05.1/game
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: npm run package:release && npm run verify:release && npm run test:release

      - name: Assemble and inspect the v12.2 Pages artifact
        working-directory: ver12.2/game
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: npm run package:release && npm run verify:release

      - name: Assemble and inspect the v13.2 Pages artifact
        working-directory: ver13.2/game
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: npm run build:clean && npm run package:release && npm run verify:release

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - name: Upload verified v13.2 with preserved v13.1, v13.0, v12.2, v5, v4, and v3 routes
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ver13.2/game/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the live release and preserved routes
        run: node ver13.2/game/scripts/verify-deployment.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
