name: Monitor shoot-mata production

on:
  schedule:
    - cron: "15 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shoot-mata-production-monitor
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
      - name: Install the pinned npm version
        run: npm install --global npm@11.19.1
      - name: Install the locked dependency tree
        working-directory: ver02/game
        run: npm ci
      - name: Reproduce the accepted artifact
        working-directory: ver02/game
        run: npm run build
      - name: Validate the operations registry
        working-directory: ver02/game
        run: npm run audit:operations
      - name: Compare every production file with the accepted release
        working-directory: ver02/game
        run: npm run audit:production
      - name: Reject high-severity dependency vulnerabilities
        working-directory: ver02/game
        run: npm audit --omit=dev --audit-level=high
