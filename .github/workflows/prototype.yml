name: Game checks

on:
  push:
  pull_request:

jobs:
  phase05:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phase05
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: phase05/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
