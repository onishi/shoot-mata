name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - phase-11-01/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: phase-11-01/package-lock.json
      - uses: actions/configure-pages@v6
      - run: npm ci
        working-directory: phase-11-01
      - run: npm run build
        working-directory: phase-11-01
      - uses: actions/upload-pages-artifact@v5
        with:
          path: phase-11-01/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
