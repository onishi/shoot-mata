<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050910">
    <title>shoot-mata v02 — Phase 05 Playable Flow</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app" data-app>
      <header class="app-header">
        <div><span>PHASE 05 / TECHNICAL FOUNDATION</span><strong>ORBITAL WRECK</strong></div>
        <button type="button" data-fullscreen>フルスクリーン</button>
      </header>
      <section class="game-shell" data-game-shell aria-label="軌道残骸帯のCanvas基盤検証">
        <canvas data-canvas width="1280" height="720" aria-label="軌道残骸帯。矢印またはWASDで移動、ZまたはSpaceで射撃、Pでポーズ"></canvas>
        <p class="canvas-status" data-canvas-status role="status">素材を読み込んでいます</p>
        <section class="screen-panel" data-screen-panel aria-live="polite" hidden>
          <p class="screen-kicker" data-screen-kicker></p>
          <h1 data-screen-title></h1>
          <p data-screen-copy></p>
          <div class="screen-actions" data-screen-actions></div>
        </section>
      </section>
      <section class="touch-controls" data-input-root aria-label="タッチ操作" hidden>
        <button type="button" class="move-pad" data-input-role="move" aria-label="指を滑らせて移動">MOVE</button>
        <button type="button" data-input-role="pause" aria-label="ポーズ">PAUSE</button>
        <button type="button" class="fire-button" data-input-role="fire" aria-label="射撃">FIRE</button>
      </section>
      <section class="display-controls" aria-label="表示設定">
        <button type="button" data-setting="reducedMotion" aria-pressed="false">動き軽減</button>
        <button type="button" data-setting="highContrast" aria-pressed="false">高コントラスト</button>
        <span data-runtime-status role="status">準備中</span>
      </section>
      <p class="sr-only" data-accessible-state aria-live="polite"></p>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
