<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050910">
    <title>shoot-mata v02</title>
    <link rel="icon" type="image/webp" href="../../assets/delivery/game/cores/reactor-core-red-v1.webp">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="app" data-app>
      <header class="app-header" data-menu-background>
        <div><span>PHASE 07 / CONTENT PRODUCTION</span><strong data-stage-label>ORBITAL WRECK</strong></div>
        <button type="button" data-fullscreen>フルスクリーン</button>
      </header>
      <section class="game-shell" data-game-shell aria-label="第1面・軌道残骸帯">
        <canvas data-canvas width="1280" height="720" tabindex="-1" aria-label="軌道残骸帯。矢印またはWASDで移動、ZまたはSpaceで射撃、Pでポーズ"></canvas>
        <p class="canvas-status" data-canvas-status role="status">素材を読み込んでいます</p>
        <section class="screen-panel" data-screen-panel role="dialog" aria-modal="true" aria-labelledby="screen-title" aria-describedby="screen-copy" hidden>
          <p class="screen-kicker" data-screen-kicker></p>
          <h1 id="screen-title" data-screen-title></h1>
          <p id="screen-copy" data-screen-copy></p>
          <div class="screen-actions" data-screen-actions></div>
        </section>
      </section>
      <section class="touch-controls" data-input-root aria-label="タッチ操作" hidden>
        <button type="button" class="move-pad" data-input-role="move" aria-label="指を滑らせて移動">MOVE</button>
        <button type="button" data-input-role="pause" aria-label="ポーズ">PAUSE</button>
        <button type="button" class="fire-button" data-input-role="fire" aria-label="射撃">FIRE</button>
      </section>
      <section class="display-controls" aria-label="表示設定" data-menu-background>
        <button type="button" data-setting="reducedMotion" aria-pressed="false">動き軽減</button>
        <button type="button" data-setting="highContrast" aria-pressed="false">高コントラスト</button>
        <span data-runtime-status role="status">準備中</span>
      </section>
      <section class="audio-controls" aria-label="音声設定" data-menu-background>
        <label>BGM <input type="range" min="0" max="1" step="0.05" data-volume="bgmVolume" aria-label="BGM音量"></label>
        <button type="button" data-audio-mute="bgmMuted" aria-pressed="false">BGMミュート</button>
        <label>効果音 <input type="range" min="0" max="1" step="0.05" data-volume="sfxVolume" aria-label="効果音量"></label>
        <button type="button" data-audio-mute="sfxMuted" aria-pressed="false">効果音ミュート</button>
      </section>
      <a class="notice-link" href="./THIRD_PARTY_NOTICES.html" data-menu-background>権利・制作情報</a>
      <p class="warning-status" data-warning-status role="status" hidden></p>
      <p class="qa-status" data-qa-status role="status" hidden></p>
      <p class="sr-only" data-accessible-state aria-live="polite"></p>
    </main>
    <script type="module" src="./main.mjs"></script>
  </body>
</html>
