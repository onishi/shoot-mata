<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07121d" />
    <meta name="description" content="過去の6〜10手と合奏するターン制時間パズル CHORUS SHIFT" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307121d'/%3E%3Cpath d='M15 18a22 22 0 0 1 34 4M12 30a27 27 0 0 1 40 2M16 43a22 22 0 0 0 32-1' fill='none' stroke='%23f3ca68' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>CHORUS SHIFT</title>
  </head>
  <body>
    <main id="app">
      <h1 class="sr-only">CHORUS SHIFT</h1>
      <p id="controls" class="sr-only">矢印またはWASDで移動、スペースで一拍待機、Backspaceで一手戻す、Rで現在のフレーズを録り直す、Hでヒント、Escapeでポーズします。</p>
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="CHORUS SHIFT タイトル" aria-describedby="controls screen-summary"></canvas>
      <p id="screen-summary" class="sr-only"></p>
      <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <section id="compact-status" aria-label="現在のゲーム状態">
        <strong id="compact-heading">CHORUS SHIFT</strong>
        <span id="compact-detail">読み込み中</span>
        <span id="compact-controls" class="compact-controls">矢印/WASD 移動 · SPACE 待機 · H ヒント · ESC ポーズ</span>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
