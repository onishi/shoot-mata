  <body>
    <main>
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="RIPPLEKEEP game canvas"></canvas>
      <section id="settings" class="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>

          <p class="eyebrow">POND CONDITIONS</p>
          <h1 id="settings-title">SETTINGS</h1>

            <span>Sound volume</span>

            <span><strong>High contrast</strong><small>Strengthen edges and separation</small></span>
            <input id="high-contrast" type="checkbox" />
          </label>
          <label class="toggle-row" for="reduced-motion">
            <span><strong>Reduce motion</strong><small>Hold decorative movement still</small></span>
            <input id="reduced-motion" type="checkbox" />
          </label>
          <button id="close-settings" type="button">ESC / S&nbsp;&nbsp;RETURN</button>
          <p id="save-state" class="save-state" aria-live="polite">Changes save on this device.</p>
        </div>
      </section>
      <p id="live" class="sr-only" aria-live="polite"></p>
      <section class="narrow-status" aria-hidden="true">
        <span id="screen-state">TITLE</span>
        <span id="controls">Enter: begin · Arrows/WASD: glide · Space: ripple</span>
      </section>
