<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#091713" />
    <title>SIGNAL GARDEN</title>
  </head>
  <body>
    <main>
      <canvas id="game" width="1280" height="720" tabindex="0" aria-label="SIGNAL GARDEN title. Press Enter to begin."></canvas>
      <aside class="settings" aria-label="Game settings">
        <button id="volume" type="button" title="Cycle sound volume (M)">SOUND 100%</button>
        <button id="motion" type="button" title="Toggle reduced motion (V)" aria-pressed="false">MOTION FULL</button>
      </aside>
      <p id="live" class="sr-only" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
